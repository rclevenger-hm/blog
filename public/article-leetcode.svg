<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#08101c"/><stop offset="1" stop-color="#0d1825"/></linearGradient></defs><rect width="900" height="520" fill="url(#b)"/><g transform="translate(80 92)" fill="none" stroke-linecap="round" stroke-width="26"><path d="M135 0L35 98l100 98" stroke="#eef2f7"/><path d="M115 36L172 98l-57 62" stroke="#f2a51a"/></g><text x="265" y="180" fill="#f7f7f7" font-family="Arial, sans-serif" font-size="70" font-weight="700">LeetCode</text><g font-family="monospace" font-size="22" fill="#91a4b8"><text x="410" y="250">def two_sum(nums, target):</text><text x="440" y="286">seen = {}</text><text x="440" y="322">for i, n in enumerate(nums):</text><text x="470" y="358">if target - n in seen:</text><text x="500" y="394">return [seen[target-n], i]</text></g><g stroke="#718096" stroke-width="4" fill="#0d1825"><line x1="150" y1="350" x2="95" y2="435"/><line x1="150" y1="350" x2="205" y2="435"/><circle cx="150" cy="330" r="38"/><circle cx="95" cy="455" r="38"/><circle cx="205" cy="455" r="38"/></g><g fill="#d8e0e8" font-family="Arial" font-size="24" text-anchor="middle"><text x="150" y="338">1</text><text x="95" y="463">2</text><text x="205" y="463">3</text></g></svg>