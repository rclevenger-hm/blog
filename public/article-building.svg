<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><linearGradient id="q" x1="0" x2="1"><stop stop-color="#101927"/><stop offset="1" stop-color="#182435"/></linearGradient></defs><rect width="900" height="520" fill="url(#q)"/><rect x="48" y="40" width="804" height="440" rx="18" fill="none" stroke="#394b62" stroke-width="3"/><text x="450" y="185" fill="#e6ebf2" font-family="Arial, sans-serif" font-size="46" text-anchor="middle">“Automation isn’t about</text><text x="450" y="247" fill="#e6ebf2" font-family="Arial, sans-serif" font-size="46" text-anchor="middle">replacing people, it’s about</text><text x="450" y="309" fill="#e6ebf2" font-family="Arial, sans-serif" font-size="46" text-anchor="middle">giving them time to do</text><text x="450" y="371" fill="#e6ebf2" font-family="Arial, sans-serif" font-size="46" text-anchor="middle">what actually matters.”</text><rect x="410" y="412" width="80" height="5" fill="#56a8ff"/></svg>