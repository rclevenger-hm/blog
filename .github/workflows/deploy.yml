name: Build and deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Build playable Antigravity Arcade demo
        env:
          GOOGLE_DEVREL_COMMIT: 68476ce6028020bac0fbbe60d9626de6a1c7e60f
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/GoogleCloudPlatform/devrel-demos.git /tmp/devrel-demos
          cd /tmp/devrel-demos
          git sparse-checkout init --cone
          git sparse-checkout set other/antigravity-arcade/games/space-shooter
          git checkout "$GOOGLE_DEVREL_COMMIT"
          cd other/antigravity-arcade/games/space-shooter
          npm install --no-audit --no-fund
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/dist/games/space-shooter"
          cp -R dist/. "$GITHUB_WORKSPACE/dist/games/space-shooter/"
          cp "$GITHUB_WORKSPACE/public/games/google-devrel-demos-LICENSE.txt" "$GITHUB_WORKSPACE/dist/games/space-shooter/LICENSE.txt"

      - name: Validate built local links and assets
        run: node scripts/check-built-links.mjs

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
